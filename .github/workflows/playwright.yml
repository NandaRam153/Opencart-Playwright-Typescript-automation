name: Playwright Tests

on:
    push:
        branches: [main, master]
    pull_request:
        branches: [main, master]

jobs:
    test:
        name: Playwright Tests
        timeout-minutes: 60
        runs-on: ubuntu-latest
        env:
            CI: true
            TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
            TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version: lts/*
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Build pw-core workspace
              run: npm run build

            - name: Typecheck
              run: npm run typecheck

            - name: Lint
              run: npm run lint

            - name: Cache Playwright browsers
              uses: actions/cache@v4
              id: playwright-cache
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

            - name: Install Playwright Chromium
              if: steps.playwright-cache.outputs.cache-hit != 'true'
              run: npx playwright install --with-deps chromium

            - name: Check wishlist credentials
              id: wishlist-creds
              run: |
                  if [ -n "$TEST_USER_EMAIL" ] && [ -n "$TEST_USER_PASSWORD" ] && \
                     [ "$TEST_USER_EMAIL" != "your-email@example.com" ] && \
                     [ "$TEST_USER_PASSWORD" != "your-password" ]; then
                    echo "configured=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "configured=false" >> "$GITHUB_OUTPUT"
                    echo "::notice::Wishlist E2E skipped — add TEST_USER_EMAIL and TEST_USER_PASSWORD secrets to enable."
                  fi

            - name: Run Playwright tests (full suite)
              if: steps.wishlist-creds.outputs.configured == 'true'
              run: npx playwright test

            - name: Run Playwright tests (without wishlist)
              if: steps.wishlist-creds.outputs.configured != 'true'
              run: npx playwright test --grep-invert @wishlist

            - uses: actions/upload-artifact@v5
              if: ${{ !cancelled() }}
              with:
                  name: playwright-report
                  path: playwright-report/
                  retention-days: 30

            - uses: actions/upload-artifact@v5
              if: failure()
              with:
                  name: test-results
                  path: test-results/
                  retention-days: 14
