name: Playwright Tests
on:
    push:
        branches: [main, master]
    pull_request:
        branches: [main, master]
jobs:
    test:
        timeout-minutes: 60
        runs-on: ubuntu-latest
        env:
            CI: true
            TEST_USER_EMAIL: ${{ fromJSON(toJSON(secrets)).TEST_USER_EMAIL }}
            TEST_USER_PASSWORD: ${{ fromJSON(toJSON(secrets)).TEST_USER_PASSWORD }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: lts/*
            - name: Install dependencies
              run: npm ci
            - name: Build pw-core workspace
              run: npm run build
            - name: Typecheck
              run: npm run typecheck
            - name: Lint
              run: npm run lint
            - name: Install Playwright Browsers
              run: npx playwright install --with-deps
            - name: Verify wishlist E2E credentials
              run: |
                  if [ -z "$TEST_USER_EMAIL" ] || [ -z "$TEST_USER_PASSWORD" ] || \
                     [ "$TEST_USER_EMAIL" = "your-email@example.com" ] || \
                     [ "$TEST_USER_PASSWORD" = "your-password" ]; then
                    echo "::error::Wishlist E2E requires TEST_USER_EMAIL and TEST_USER_PASSWORD repository secrets."
                    exit 1
                  fi
            - name: Run Playwright tests
              run: npx playwright test
            - uses: actions/upload-artifact@v4
              if: ${{ !cancelled() }}
              with:
                  name: playwright-report
                  path: playwright-report/
                  retention-days: 30
            - uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: test-results
                  path: test-results/
                  retention-days: 14
