name: Quality Gates

on:
    push:
        branches: [main, master]
    pull_request:
        branches: [main, master]
    schedule:
        # Nightly full regression (06:00 UTC)
        - cron: '0 6 * * *'

concurrency:
    group: quality-gates-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

env:
    CI: true

jobs:
    static:
        name: Static analysis
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: lts/*
                  cache: npm
            - run: npm ci
            - run: npm run verify:static

    wishlist-secrets:
        name: Wishlist credentials probe
        runs-on: ubuntu-latest
        outputs:
            configured: ${{ steps.probe.outputs.configured }}
        steps:
            - id: probe
              env:
                  TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
                  TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
              run: |
                  if [ -n "$TEST_USER_EMAIL" ] && [ -n "$TEST_USER_PASSWORD" ] && \
                     [ "$TEST_USER_EMAIL" != "your-email@example.com" ] && \
                     [ "$TEST_USER_PASSWORD" != "your-password" ]; then
                    echo "configured=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "configured=false" >> "$GITHUB_OUTPUT"
                    echo "::notice::Wishlist E2E skipped — add TEST_USER_EMAIL and TEST_USER_PASSWORD repository secrets to enable."
                  fi

    sut-health:
        name: SUT health
        needs: static
        runs-on: ubuntu-latest
        timeout-minutes: 10
        env:
            SUT_HEALTH_ATTEMPTS: 5
            SUT_HEALTH_TIMEOUT_MS: 25000
            SUT_HEALTH_RETRY_DELAY_MS: 5000
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: lts/*
            - run: npm run verify:sut

    # PR: one browser job (single npm ci + one Playwright install) — API + smoke + optional wishlist
    test-pr:
        name: PR tests (API + smoke)
        needs: [static, sut-health, wishlist-secrets]
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        timeout-minutes: 25
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: lts/*
                  cache: npm
            - run: npm ci
            - name: Cache Playwright browsers
              uses: actions/cache@v4
              id: playwright-cache
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
            - name: Install Playwright Browsers
              run: npx playwright install --with-deps chromium webkit firefox
            - run: npm run verify:api
            - run: npm run verify:smoke
            - name: Wishlist E2E (@wishlist)
              if: >-
                  github.event.pull_request.head.repo.full_name == github.repository &&
                  needs.wishlist-secrets.outputs.configured == 'true'
              env:
                  TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
                  TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
              run: |
                  sh scripts/verify-wishlist-credentials.sh
                  npm run verify:wishlist
            - uses: actions/upload-artifact@v5
              if: failure()
              with:
                  name: pr-test-results
                  path: test-results/
                  retention-days: 7

    # main / nightly: full suite (static + sut already passed in sibling jobs)
    test-full:
        name: Full Playwright suite
        needs: [static, sut-health, wishlist-secrets]
        if: github.event_name == 'push' || github.event_name == 'schedule'
        runs-on: ubuntu-latest
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: lts/*
                  cache: npm
            - run: npm ci
            - name: Cache Playwright browsers
              uses: actions/cache@v4
              id: playwright-cache
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
            - name: Install Playwright Browsers
              run: npx playwright install --with-deps chromium webkit firefox
            - name: Run full suite (with wishlist)
              if: needs.wishlist-secrets.outputs.configured == 'true'
              env:
                  TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
                  TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
              run: |
                  sh scripts/verify-wishlist-credentials.sh
                  npx playwright test
            - name: Run suite without wishlist
              if: needs.wishlist-secrets.outputs.configured != 'true'
              run: npx playwright test --grep-invert @wishlist
            - uses: actions/upload-artifact@v5
              if: ${{ !cancelled() }}
              with:
                  name: playwright-report
                  path: playwright-report/
                  retention-days: 30
            - uses: actions/upload-artifact@v5
              if: failure()
              with:
                  name: test-results
                  path: test-results/
                  retention-days: 14
