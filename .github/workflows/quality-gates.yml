name: Quality Gates

on:
    push:
        branches: [main, master]
    pull_request:
        branches: [main, master]
    schedule:
        # Nightly full regression (06:00 UTC)
        - cron: '0 6 * * *'

concurrency:
    group: quality-gates-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

env:
    CI: true

jobs:
    static:
        name: Static analysis
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: lts/*
                  cache: npm
            - run: npm ci
            - run: npm run verify:static

    sut-health:
        name: SUT health
        needs: static
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: lts/*
            - run: npm run verify:sut

    test-api:
        name: API tests
        needs: static
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: lts/*
                  cache: npm
            - run: npm ci
            - run: npx playwright install --with-deps chromium
            - run: npm run verify:api

    test-smoke:
        name: Smoke tests (@smoke)
        needs: sut-health
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: lts/*
                  cache: npm
            - run: npm ci
            - run: npx playwright install --with-deps chromium
            - run: npm run verify:smoke
            - uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: smoke-test-results
                  path: test-results/
                  retention-days: 7

    test-wishlist:
        name: Wishlist E2E (@wishlist)
        needs: sut-health
        if: >-
            github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-latest
        timeout-minutes: 20
        env:
            TEST_USER_EMAIL: ${{ fromJSON(toJSON(secrets)).TEST_USER_EMAIL }}
            TEST_USER_PASSWORD: ${{ fromJSON(toJSON(secrets)).TEST_USER_PASSWORD }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: lts/*
                  cache: npm
            - run: npm ci
            - run: sh scripts/verify-wishlist-credentials.sh
            - run: npx playwright install --with-deps chromium
            - run: npm run verify:wishlist

    test-full:
        name: Full Playwright suite
        needs: sut-health
        if: github.event_name == 'push' || github.event_name == 'schedule'
        runs-on: ubuntu-latest
        timeout-minutes: 60
        env:
            TEST_USER_EMAIL: ${{ fromJSON(toJSON(secrets)).TEST_USER_EMAIL }}
            TEST_USER_PASSWORD: ${{ fromJSON(toJSON(secrets)).TEST_USER_PASSWORD }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: lts/*
                  cache: npm
            - run: npm ci
            - run: sh scripts/verify-wishlist-credentials.sh
            - run: npx playwright install --with-deps
            - run: npm run verify:full
            - uses: actions/upload-artifact@v4
              if: ${{ !cancelled() }}
              with:
                  name: playwright-report
                  path: playwright-report/
                  retention-days: 30
            - uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: test-results
                  path: test-results/
                  retention-days: 14
