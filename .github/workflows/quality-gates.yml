name: Quality Gates

on:
    push:
        branches: [main, master]
    pull_request:
        branches: [main, master]
    schedule:
        # Nightly full regression (06:00 UTC)
        - cron: '0 6 * * *'

concurrency:
    group: quality-gates-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

env:
    CI: true

jobs:
    static:
        name: Static analysis
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: lts/*
                  cache: npm
            - run: npm ci
            - run: npm run verify:static

    sut-health:
        name: SUT health
        needs: static
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: lts/*
            - run: npm run verify:sut

    wishlist-secrets:
        name: Wishlist credentials probe
        runs-on: ubuntu-latest
        outputs:
            configured: ${{ steps.probe.outputs.configured }}
        steps:
            - id: probe
              env:
                  TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
                  TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
              run: |
                  if [ -n "$TEST_USER_EMAIL" ] && [ -n "$TEST_USER_PASSWORD" ] && \
                     [ "$TEST_USER_EMAIL" != "your-email@example.com" ] && \
                     [ "$TEST_USER_PASSWORD" != "your-password" ]; then
                    echo "configured=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "configured=false" >> "$GITHUB_OUTPUT"
                    echo "::notice::Wishlist E2E skipped — add TEST_USER_EMAIL and TEST_USER_PASSWORD repository secrets (Settings → Secrets and variables → Actions) to enable."
                  fi

    test-api:
        name: API tests
        needs: static
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: lts/*
                  cache: npm
            - run: npm ci
            - run: npx playwright install --with-deps chromium
            - run: npm run verify:api

    test-smoke:
        name: Smoke tests (@smoke)
        needs: sut-health
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: lts/*
                  cache: npm
            - run: npm ci
            - run: npx playwright install --with-deps chromium
            - run: npm run verify:smoke
            - uses: actions/upload-artifact@v5
              if: failure()
              with:
                  name: smoke-test-results
                  path: test-results/
                  retention-days: 7

    test-wishlist:
        name: Wishlist E2E (@wishlist)
        needs: [sut-health, wishlist-secrets]
        if: >-
            github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            needs.wishlist-secrets.outputs.configured == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 20
        env:
            TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
            TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: lts/*
                  cache: npm
            - run: npm ci
            - run: sh scripts/verify-wishlist-credentials.sh
            - run: npx playwright install --with-deps chromium
            - run: npm run verify:wishlist

    test-full:
        name: Full Playwright suite
        needs: [sut-health, wishlist-secrets]
        if: github.event_name == 'push' || github.event_name == 'schedule'
        runs-on: ubuntu-latest
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: lts/*
                  cache: npm
            - run: npm ci
            - name: Verify wishlist credentials
              if: needs.wishlist-secrets.outputs.configured == 'true'
              env:
                  TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
                  TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
              run: sh scripts/verify-wishlist-credentials.sh
            - run: npx playwright install --with-deps
            - name: Run full suite (with wishlist)
              if: needs.wishlist-secrets.outputs.configured == 'true'
              env:
                  TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
                  TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
              run: npm run verify:full
            - name: Run suite without wishlist
              if: needs.wishlist-secrets.outputs.configured != 'true'
              run: npx playwright test --grep-invert @wishlist
            - uses: actions/upload-artifact@v5
              if: ${{ !cancelled() }}
              with:
                  name: playwright-report
                  path: playwright-report/
                  retention-days: 30
            - uses: actions/upload-artifact@v5
              if: failure()
              with:
                  name: test-results
                  path: test-results/
                  retention-days: 14
